# Barka - Cloudflare Pages / Workers Configuration
name = "barka"
type = "javascript"
compatibility_date = "2024-01-01"

# For Pages, this is optional - Pages uses its own build config
# But if you want to use Workers with static assets:

[site]
bucket = "./dist"

# Build configuration for Cloudflare Pages (also set in dashboard)
[build]
command = "npm run build"
# Output directory is set in dashboard as "dist"

# Environment variables (set these in Cloudflare dashboard, not here)
# VITE_SUPABASE_URL
# VITE_SUPABASE_ANON_KEY
